<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Aiyra e a Mãe da Floresta.">
  <meta name="theme-color" content="#10251a">
  <title>Aiyra e a Mãe da Floresta</title>
  <script>
    if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      document.documentElement.classList.add('is-loading');
      setTimeout(() => document.documentElement.classList.remove('is-loading'), 4500);
    }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="animation.js" defer></script>
</head>
<body>
  <div class="page">
    <main>
      <h1 class="visually-hidden">Aiyra e a Mãe da Floresta</h1>

      <div class="journey">
        <div class="scene">
          <div class="artwork" role="img" aria-label="Aiyra e um tucano em meio a folhas verdes desenhadas.">
            <img class="layer background" src="assets/Folhas_BG.webp" alt="" width="1080" height="1920" decoding="async" fetchpriority="high">
            <div class="layer foreground">
              <img class="layer logo" src="assets/Logo.png" alt="" width="1080" height="1920" decoding="async">
              <img class="layer character" src="assets/Personagem.webp" alt="" width="1080" height="1920" decoding="async">
              <img class="layer lower-leaves" src="assets/Folhas_Baixo.webp" alt="" width="1080" height="1920" decoding="async">
              <img class="layer upper-leaves" src="assets/Folhas_Alto.webp" alt="" width="1080" height="1920" decoding="async">
              <img class="layer left-leaves" src="assets/Folhas_Esquerda.webp" alt="" width="1080" height="1920" decoding="async">
              <img class="layer right-leaves" src="assets/Folhas_Direita.webp" alt="" width="1080" height="1920" decoding="async">
            </div>
          </div>
        </div>
      </div>

      <div class="content" id="conteudo"></div>
    </main>

    <footer class="footer">
      <img class="footer-art" src="assets/Rodap%C3%A9.webp" alt="" width="1080" height="844" loading="lazy" decoding="async">
      <img class="layer footer-logo" src="assets/Logo_Flopes.png" alt="Flopes — arte e fotografia" width="1080" height="844" loading="lazy" decoding="async">
    </footer>
  </div>
</body>
</html>
