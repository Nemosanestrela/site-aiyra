<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Aiyra e a Mãe da Floresta.">
  <meta name="theme-color" content="#10251a">
  <title>Aiyra e a Mãe da Floresta</title>
  <link rel="stylesheet" href="style.css">
  <script src="animation.js" defer></script>
</head>
<body>
  <div class="page">
    <main>
      <h1 class="visually-hidden">Aiyra e a Mãe da Floresta</h1>

      <div class="journey">
        <div class="scene">
          <div class="artwork" role="img" aria-label="Aiyra e um tucano em meio a folhas verdes desenhadas.">
            <img class="layer background" src="assets/Folhas_BG.png" alt="" width="1080" height="1920" fetchpriority="high">
            <img class="layer logo" src="assets/Logo.png" alt="" width="1080" height="1920">
            <img class="layer character" src="assets/Personagem.png" alt="" width="1080" height="1920">
            <img class="layer lower-leaves" src="assets/Folhas_Baixo.png" alt="" width="1080" height="1920">
            <img class="layer upper-leaves" src="assets/Folhas_Alto.png" alt="" width="1080" height="1920">
            <img class="layer left-leaves" src="assets/Folhas_Esquerda.png" alt="" width="1080" height="1920">
            <img class="layer right-leaves" src="assets/Folhas_Direita.png" alt="" width="1080" height="1920">
          </div>
        </div>
      </div>

      <div class="content" id="conteudo"></div>
    </main>

    <footer class="footer">
      <img class="footer-art" src="assets/Rodap%C3%A9.png" alt="" width="1080" height="844" loading="lazy">
      <img class="layer footer-logo" src="assets/Logo_Flopes.png" alt="Flopes — arte e fotografia" width="1080" height="844" loading="lazy">
    </footer>
  </div>
</body>
</html>
