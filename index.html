<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Aiyra e a Mãe da Floresta.">
  <meta name="theme-color" content="#10251a">
  <title>Aiyra e a Mãe da Floresta</title>
  <script>
    if (performance.getEntriesByType('navigation')[0]?.type === 'reload') {
      const previousRestoration = history.scrollRestoration;
      history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);
      window.addEventListener('pageshow', () => {
        requestAnimationFrame(() => {
          window.scrollTo(0, 0);
          history.scrollRestoration = previousRestoration;
        });
      }, { once: true });
    }

    if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      const root = document.documentElement;
      const driftStrength = 0.8 + Math.random() * 0.4;
      root.style.setProperty('--drift-bias', Math.random() < 0.5 ? driftStrength : -driftStrength);
      root.classList.add('is-loading');
      setTimeout(() => {
        if (!root.classList.contains('is-expanding')) root.classList.remove('is-loading', 'is-landed');
      }, 20000);
    }
  </script>
  <link rel="stylesheet" href="style.css?v=9">
  <script src="animation.js?v=9" defer></script>
</head>
<body>
  <div class="loading-screen" aria-hidden="true">
    <span class="loading-drift"><span class="light-halo loading-light"></span></span>
  </div>
  <div class="floating-light" aria-hidden="true" hidden>
    <span class="floating-light-path"><span class="light-halo"></span></span>
  </div>
  <div class="page">
    <main>
      <h1 class="visually-hidden">Aiyra e a Mãe da Floresta</h1>

      <div class="journey">
        <div class="scene">
          <div class="artwork" role="img" aria-label="Aiyra e um tucano em meio a folhas verdes desenhadas.">
            <img class="layer background" src="assets/Folhas_BG.webp?v=2" alt="" width="1080" height="1920" decoding="async" fetchpriority="high">
            <div class="layer rear-leaves">
              <img class="layer rear-leaves-art" src="assets/Folhas_Baixo.webp?v=2" alt="" width="1080" height="1920" decoding="async">
            </div>
            <img class="layer logo" src="assets/Logo.png" alt="" width="1080" height="1920" decoding="async">
            <img class="layer character" src="assets/Personagem.webp?v=2" alt="" width="1080" height="1920" decoding="async">
            <img class="layer lower-leaves" src="assets/Folhas_Baixo.webp?v=2" alt="" width="1080" height="1920" decoding="async">
            <img class="layer upper-leaves" src="assets/Folhas_Alto.webp?v=2" alt="" width="1080" height="1920" decoding="async">
            <img class="layer left-leaves" src="assets/Folhas_Esquerda.webp?v=2" alt="" width="1080" height="1920" decoding="async">
            <img class="layer right-leaves" src="assets/Folhas_Direita.webp?v=2" alt="" width="1080" height="1920" decoding="async">
          </div>
        </div>
      </div>

      <div class="content" id="conteudo">
        <div class="video-player">
          <button class="video-play" type="button" data-youtube-id="MRvlvlWwvcg" aria-label="Reproduzir Carlinhos Brown — Paxuá e Paramim">
            <img src="assets/paxua-e-paramim.jpg" alt="" width="480" height="360" loading="lazy" decoding="async">
            <span class="video-play-icon" aria-hidden="true"></span>
          </button>
          <p class="video-note" role="status" hidden></p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <img class="footer-art" src="assets/Rodap%C3%A9.webp?v=2" alt="" width="1080" height="844" loading="lazy" decoding="async">
      <img class="layer footer-logo" src="assets/Logo_Flopes.png" alt="Flopes — arte e fotografia" width="1080" height="844" loading="lazy" decoding="async">
    </footer>
  </div>
</body>
</html>
